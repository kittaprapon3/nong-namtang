<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-screen floor-plan map like a game world; a quest tracker floats on top, the turn-by-turn panel on the bottom, quest log and chat open as sheets. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --ink:#132522; --muted:#566b67; --line:#d5e0de;
  --accent:#0a6b61; --accent-ink:#ffffff; --bot:#e5f0ed; --me:#0a6b61; --me-ink:#ffffff;
  --warn-bg:#fdecea; --warn-ink:#9b1c12;
  --gold:#d29a06; --gold-ink:#2b1d00; --gold-soft:#fbefc8;
  --map-bg:#e7efed; --grid:#d8e3e0; --floor:#f8fbfa; --room:#e3ebe9; --wall:#93a9a4; --here:#2a6ff0;
  --shadow:0 8px 28px rgb(10 40 36 / .16);
  --f-display:"Bai Jamjuree","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#16211f; --ink:#e2ecea; --muted:#94a8a4; --line:#2a3a37;
  --accent:#4fc0b1; --accent-ink:#06201c; --bot:#1d2b29; --me:#2f8f84; --me-ink:#ffffff;
  --warn-bg:#3a1714; --warn-ink:#ffb4ab;
  --gold:#f2c14e; --gold-ink:#2b1d00; --gold-soft:#3a2f12;
  --map-bg:#0a1311; --grid:#14211e; --floor:#111c1a; --room:#1c2a27; --wall:#4d625d; --here:#5b95ff;
  --shadow:0 8px 28px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#16211f; --ink:#e2ecea; --muted:#94a8a4; --line:#2a3a37;
  --accent:#4fc0b1; --accent-ink:#06201c; --bot:#1d2b29; --me:#2f8f84; --me-ink:#ffffff;
  --warn-bg:#3a1714; --warn-ink:#ffb4ab;
  --gold:#f2c14e; --gold-ink:#2b1d00; --gold-soft:#3a2f12;
  --map-bg:#0a1311; --grid:#14211e; --floor:#111c1a; --room:#1c2a27; --wall:#4d625d; --here:#5b95ff;
  --shadow:0 8px 28px rgb(0 0 0 / .45); color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--map-bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden}
button,select,input{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud.top{top:0;padding-block:12px 0}
.hud.bottom{bottom:0;padding-block:0 12px}
.hud>*{pointer-events:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:560px;margin:0 auto;box-sizing:border-box}

.quest{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;align-items:center;gap:8px}
.qtag{font:700 .78rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qbar{flex:1;display:flex;gap:3px;min-width:0}
.qbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--gold)}
.qbar i.now{background:var(--accent)}
.iconbtn{font:700 .85rem var(--f-body);min-width:38px;height:34px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.qtitle{display:flex;align-items:center;gap:10px;margin:0}
.qtitle .ico{font-size:1.5rem;line-height:1}
.qtitle h1{font:700 1.3rem/1.2 var(--f-display);margin:0;text-wrap:balance}
.qdesc{margin:0;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.objs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.obj{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;align-items:center;padding:7px 8px;border-radius:12px;background:var(--bg);border:1.5px solid transparent;min-width:0}
.obj .dist{grid-column:2}
.obj.cur{border-color:var(--accent)}
.obj input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.obj .on{font:600 .92rem var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer}
.obj.ok .on{color:var(--muted);text-decoration:line-through}
.obj .dist{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.obj.cur .dist{color:var(--accent);font-weight:700}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:600 1rem var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.45;cursor:default}

.fabrow{display:flex;justify-content:flex-end;gap:8px;width:100%;max-width:560px;margin:0 auto;pointer-events:none}
.fab{pointer-events:auto;font:600 .92rem var(--f-body);height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fab.chat{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.navp{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.route{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.route b{font:700 1.08rem var(--f-display);min-width:0}
.route span{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.turns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:50px;overflow-y:auto}
.turns li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:.95rem}
.turns li:first-child{font-weight:600}
.turns .ic{color:var(--accent);font-weight:700;text-align:center}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.herechip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--bg);min-width:0}
.herechip select{border:0;background:transparent;color:var(--ink);font:500 .95rem var(--f-body);padding:11px 0;width:100%;min-width:0}

/* ---------- map ---------- */
.gl{stroke:var(--grid);stroke-width:.25;fill:none}
.floorr{fill:var(--floor)}
.room{fill:var(--room);stroke:var(--wall);stroke-width:1.2px;vector-effect:non-scaling-stroke;cursor:pointer}
.room.hit{fill:color-mix(in srgb,var(--accent) 28%,var(--room));stroke:var(--accent);stroke-width:2.2px}
.room.quest{fill:color-mix(in srgb,var(--gold) 18%,var(--room))}
.wall,.outline{stroke:var(--wall);stroke-width:2px;vector-effect:non-scaling-stroke;fill:none}
.rl{font:500 11.5px var(--f-body);fill:var(--ink);pointer-events:none}
.rl.hit{font-weight:700}
#map.far .rl:not(.hit){display:none}
#map.mid .rl{font-size:9.5px}
#map.drag{cursor:grabbing}
.ml{font:700 12px var(--f-body);paint-order:stroke;stroke:var(--floor);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.r-under{fill:none;stroke:var(--accent);stroke-width:12px;stroke-linecap:round;stroke-linejoin:round;opacity:.22;vector-effect:non-scaling-stroke}
.r-line{fill:none;stroke:var(--accent);stroke-width:5px;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8;vector-effect:non-scaling-stroke;animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.here{fill:var(--here);stroke:#ffffff;stroke-width:3}
.pulse{fill:var(--here);opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.6}to{transform:scale(2.6);opacity:0}}
.walker{fill:#ffffff;stroke:var(--accent);stroke-width:3}
.pin{fill:var(--accent);stroke:#ffffff;stroke-width:2}
.badge{stroke:#ffffff;stroke-width:2}
.badge.todo{fill:var(--gold)}.badge.ok{fill:var(--accent)}
.bt{font:800 12px var(--f-display);text-anchor:middle;pointer-events:none}
.bt.todo{fill:var(--gold-ink)}.bt.ok{fill:var(--accent-ink)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgb(0 0 0 / .35);z-index:15}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:82%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-block:14px max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.sheet>.in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{font:700 1.2rem var(--f-display);margin:0}
.sbody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion: no-preference){.sheet:not([hidden]){animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}

.qlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlog>li>button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem var(--f-body);cursor:pointer}
.qlog .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;background:var(--bg);font-variant-numeric:tabular-nums}
.qlog .ok .st{background:var(--gold);color:var(--gold-ink)}
.qlog .ok .nm{color:var(--muted);text-decoration:line-through}
.qlog .now>button{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.qlog .now .st{background:var(--accent);color:var(--accent-ink)}
.qlog .lock{opacity:.7}
.qlog .tagr{font-size:.8rem;color:var(--muted);font-weight:500}
.qlog .subs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 44px}
.qlog .sub{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.qlog .sub.ok{background:var(--gold-soft);text-decoration:line-through;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.82rem}

.msgs{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:180px;flex:1}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;min-width:0;overflow-wrap:anywhere}
.msg.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.urgent{background:var(--warn-bg);color:var(--warn-ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .92rem var(--f-body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.chip.go{background:var(--accent);color:var(--accent-ink)}
.typing{color:var(--muted);font-size:.9rem;align-self:flex-start}
form{display:flex;gap:8px}
form input{flex:1;min-width:0;font:400 1rem var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

.toast{position:absolute;left:50%;top:40%;z-index:30;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;background:var(--gold);color:var(--gold-ink);font:700 1.05rem var(--f-display);padding:12px 20px;border-radius:16px;box-shadow:var(--shadow);text-align:center;max-width:80%;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{display:block;font:600 .8rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
@media (prefers-reduced-motion: reduce){.r-line,.pulse{animation:none}.walker{display:none}.toast{transition:none}}
</style>

<div id="app">
  <svg id="map" role="img" aria-label="แผนที่นำทาง"></svg>

  <div class="hud top">
    <section class="panel quest" id="quest" aria-live="polite">
      <div class="qhead">
        <span class="qtag" id="qtag"></span>
        <div class="qbar" id="qbar" aria-hidden="true"></div>
        <button class="iconbtn" id="voiceBtn" type="button"></button>
        <button class="iconbtn" id="langBtn" type="button"></button>
        <button class="iconbtn" id="logBtn" type="button"></button>
      </div>
      <div class="qtitle"><span class="ico" id="qico" aria-hidden="true"></span><h1 id="qtitle"></h1></div>
      <p class="qdesc" id="qdesc"></p>
      <div id="qextra"></div>
    </section>
  </div>

  <div class="hud bottom">
    <div class="fabrow">
      <button class="fab" id="sayBtn" type="button"></button>
      <button class="fab" id="camBtn" type="button"></button>
      <button class="fab chat" id="chatBtn" type="button"></button>
    </div>
    <section class="panel navp" id="navp">
      <div class="route" id="sum"></div>
      <ol class="turns" id="turns"></ol>
      <div class="actions">
        <label class="herechip" for="hereSel"><span aria-hidden="true">📍</span><select id="hereSel"></select></label>
        <button class="btn primary" id="arrivedBtn" type="button"></button>
      </div>
    </section>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="logSheet" hidden aria-labelledby="logH">
    <div class="in">
      <div class="shead"><h2 id="logH"></h2><button class="iconbtn" type="button" data-close>✕</button></div>
      <div class="sbody">
        <ol class="qlog" id="qlog"></ol>
        <p class="note" id="hint"></p>
        <button class="btn" id="resetBtn" type="button"></button>
        <p class="note" id="note"></p>
      </div>
    </div>
  </section>

  <section class="sheet" id="chatSheet" hidden aria-labelledby="chatH">
    <div class="in">
      <div class="shead"><h2 id="chatH"></h2><button class="iconbtn" type="button" data-close>✕</button></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form id="form">
        <input id="q" type="text" autocomplete="off" aria-labelledby="chatH">
        <button class="btn primary" id="sendBtn" type="submit"></button>
      </form>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</div>

const canSpeak="speechSynthesis" in window;
let lastSpeech="",warnedVoice=false,actx=null;
function voiceFor(L){try{return speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(L==="th"?"th":"en"))}catch(e){return null}}
function cleanSpeech(t){return t.replace(/(\d+)\s*ม\./g,"$1 เมตร").replace(/(\d+)\s*m\b/g,"$1 meters").replace(/รพ\./g,"โรงพยาบาล")
  .replace(/[\u{1F000}-\u{1FFFF}←-⇿⌀-⏿☀-➿⬀-⯿⚑✓✕☰⤢◎⇧⇩↰↱↑]/gu,"").replace(/\s+/g," ").trim()}
function say(text,force){
  lastSpeech=text;if(!canSpeak||(!voiceOn&&!force))return;
  try{speechSynthesis.cancel();const L=/[฀-๿]/.test(text)?"th":"en";
    const u=new SpeechSynthesisUtterance(cleanSpeech(text));u.lang=L==="th"?"th-TH":"en-US";const v=voiceFor(L);if(v)u.voice=v;u.rate=L==="th"?1:.95;
    if(!v&&!warnedVoice&&speechSynthesis.getVoices().length){warnedVoice=true;toast("🔇",UI[L].noVoice)}
    speechSynthesis.speak(u)}catch(e){}
}
function chime(big){if(!voiceOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  (big?[523,659,784,1047]:[659,988]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.11);g.gain.linearRampToValueAtTime(.18,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.35);
    o.connect(g);g.connect(actx.destination);o.start(t+i*.11);o.stop(t+i*.11+.4)})}catch(e){}}
function routeSpeech(){const p=here===dest?[here]:shortest(here,dest);if(here===dest)return"";

   r:L=>({text:T(L,"สวัสดีค่ะ ถามทางหรือขั้นตอนตรวจสุขภาพได้เลยนะคะ","Hello! Ask me about directions or your check-up steps."),chips:quickChips(L)})},
  {kw:["ขอบคุณ","thank","thanks"],
   r:L=>({text:T(L,"ยินดีค่ะ ขอให้สุขภาพแข็งแรงนะคะ 🙏","You're welcome. Stay healthy! 🙏")})}
];
INTENTS.forEach(it=>it.nkw=it.kw.map(norm));
function answer(q){
  const L=/[฀-๿]/.test(q)?"th":"en",n=norm(q);
  let best=null,score=0;
  for(const it of INTENTS){const s=it.nkw.reduce((a,k)=>n.includes(k)?a+k.length:a,0);
    if(s>0&&it.urgent)return it.r(L);if(s>score){score=s;best=it}}
  if(best)return best.r(L);
  return{text:T(L,"ขอโทษค่ะ น้องนำทางยังไม่เข้าใจคำถามนี้ ลองเลือกหัวข้อด้านล่าง หรือสอบถามเจ้าหน้าที่ที่เคาน์เตอร์เวชระเบียนได้เลยค่ะ","Sorry, I didn't understand that. Try a topic below or ask staff at the Medical Records counter."),chips:quickChips(L)};
}

/* ================= แชต ================= */
const msgs=$("msgs");
function addMe(text){const d=document.createElement("div");d.className="msg me";d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
function addBot(res){
  const L=/[฀-๿]/.test(res.text)?"th":"en";
  const d=document.createElement("div");d.className="msg bot"+(res.urgent?" urgent":"");d.textContent=res.text;msgs.appendChild(d);
  const c=document.createElement("div");c.className="chips";
  if(res.stage){goToStage(res.stage,res.from)}else if(res.dest){setDest(res.dest)}
  say(res.text+(res.dest||res.stage?" "+routeSpeech():""));
  if(res.stage||res.dest){const b=document.createElement("button");b.type="button";b.className="chip go";b.textContent=UI[L].showMap;b.onclick=closeSheets;c.appendChild(b)}
  (res.chips||[]).forEach(t=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)});
  if(c.children.length)msgs.appendChild(c);
  msgs.scrollTop=msgs.scrollHeight;
}
function send(text){
  text=text.trim();if(!text)return;addMe(text);
  const t=document.createElement("div");t.className="typing";t.textContent="…";msgs.appendChild(t);msgs.scrollTop=msgs.scrollHeight;
  setTimeout(()=>{t.remove();addBot(answer(text))},350);
}
$("form").addEventListener("submit",e=>{e.preventDefault();const q=$("q");send(q.value);q.value=""});

render();
addBot({text:"สวัสดีค่ะ น้องนำทางพร้อมช่วยค่ะ ถามทางหรือขั้นตอนตรวจสุขภาพได้เลย เช่น “รับบัตรแล้วไปไหนต่อ” (You can ask in English too)",chips:quickChips("th")});
lastSpeech="";try{speechSynthesis.cancel()}catch(e){}
</script>
