<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>น้องนำทาง OPD</title>
<meta name="theme-color" content="#0d9488">
<meta name="description" content="นำทางผู้ป่วยตรวจสุขภาพ บอกขั้นตอนและเส้นทางในโรงพยาบาล">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="น้องนำทาง">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen floor-plan map; a glass quest card floats on top, the directions card at the bottom, list and chat open as sheets.
   Single light theme on purpose (bright, clinical, readable for older patients). Body face is a looped Thai font, easier for seniors to read. */
:root{
  color-scheme:light;
  --bg:#f1f5f9; --surface:#ffffff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0;
  --accent:#0d9488; --accent-2:#14b8a6; --accent-ink:#ffffff; --bot:#f0fdfa; --me:#0d9488; --me-ink:#ffffff;
  --warn-bg:#fef2f2; --warn-ink:#b91c1c;
  --gold:#f59e0b; --gold-2:#fbbf24; --gold-ink:#3b2300; --gold-soft:#fef3c7;
  --map-bg:#e8eff5; --grid:#d7e1ea; --floor:#ffffff; --room:#eef3f8; --wall:#b6c3d1; --here:#2563eb;
  --glass:rgb(255 255 255 / .88);
  --shadow:0 14px 34px -10px rgb(15 23 42 / .22),0 2px 6px rgb(15 23 42 / .06);
  --f-display:"Prompt","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--map-bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;overflow:hidden}
button,select,input{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud.top{top:0;padding-block:12px 0}
.hud.bottom{bottom:0;padding-block:0 12px}
.hud>*{pointer-events:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:560px;margin:0 auto;box-sizing:border-box}

.quest{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;align-items:center;gap:8px}
.qtag{font:700 .9rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qbar{flex:1;display:flex;gap:3px;min-width:0}
.qbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--gold)}
.qbar i.now{background:var(--accent)}
@media (max-width:420px){.qbar{visibility:hidden}}
.iconbtn{white-space:nowrap;flex-shrink:0;font:700 .95rem var(--f-body);min-width:44px;height:42px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.qtitle{display:flex;align-items:center;gap:10px;margin:0}
.qtitle .ico{font-size:1.5rem;line-height:1}
.qtitle h1{font:700 1.55rem/1.2 var(--f-display);margin:0;text-wrap:balance}
.qdesc{margin:0;color:var(--ink);font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.objs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.obj{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;align-items:center;padding:7px 8px;border-radius:12px;background:var(--bg);border:1.5px solid transparent;min-width:0}
.obj .dist{grid-column:2}
.obj.cur{border-color:var(--accent)}
.obj input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.obj .on{font:600 .92rem var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer}
.obj.ok .on{color:var(--muted);text-decoration:line-through}
.obj .dist{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.obj.cur .dist{color:var(--accent);font-weight:700}
.ft{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ft .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.ft label{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:8px;font:600 .85rem var(--f-body);color:var(--muted)}
.ft select{min-width:0;font:600 1rem var(--f-body);padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.ft .swap{width:44px;height:84px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font-size:1.3rem;cursor:pointer}
.actions.solo{grid-template-columns:1fr}
.botq{display:flex;flex-direction:column;gap:10px}
.botq p{margin:0;font:700 1.25rem/1.3 var(--f-display);text-wrap:balance}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:700 1.1rem var(--f-body);padding:15px 14px;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.45;cursor:default}

.fabrow{display:flex;justify-content:flex-end;align-items:center;gap:6px;width:100%;max-width:560px;margin:0 auto;pointer-events:none}
.fab{pointer-events:auto;font:700 1rem var(--f-body);height:52px;padding:0 12px;white-space:nowrap;flex-shrink:0;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fab.talk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fab.icon{width:52px;padding:0;justify-content:center;margin-right:auto;font-size:1.25rem}
.navp{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.route{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.route b{font:700 1.25rem var(--f-display);min-width:0}
.route span{font-size:1rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.turns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:66px;overflow-y:auto}
.turns li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:1.08rem}
.turns li:first-child{font-weight:600}
.turns .ic{color:var(--accent);font-weight:700;text-align:center}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.herechip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;background:var(--bg);min-width:0}
.herechip select{border:0;background:transparent;color:var(--ink);font:500 .95rem var(--f-body);padding:11px 0;width:100%;min-width:0}

/* ---------- map ---------- */
.gl{stroke:var(--grid);stroke-width:.25;fill:none}
.floorr{fill:var(--floor)}
.room{fill:var(--room);stroke:var(--wall);stroke-width:1.2px;vector-effect:non-scaling-stroke;cursor:pointer}
.room.hit{fill:color-mix(in srgb,var(--accent) 28%,var(--room));stroke:var(--accent);stroke-width:2.2px}
.room.quest{fill:color-mix(in srgb,var(--gold) 18%,var(--room))}
.wall,.outline{stroke:var(--wall);stroke-width:2px;vector-effect:non-scaling-stroke;fill:none}
.rl{font:500 11.5px var(--f-body);fill:var(--ink);pointer-events:none}
.rl.hit{font-weight:700}
#map.far .rl:not(.hit){display:none}
#map.mid .rl{font-size:9.5px}
#map.tiny .rl{font-size:8px}#map.tiny .rl.sm{font-size:6.5px}
.rl.sm{font-size:8.5px}
#map.drag{cursor:grabbing}
.ml{font:700 12px var(--f-body);paint-order:stroke;stroke:var(--floor);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.r-under{fill:none;stroke:var(--accent);stroke-width:12px;stroke-linecap:round;stroke-linejoin:round;opacity:.22;vector-effect:non-scaling-stroke}
.r-line{fill:none;stroke:var(--accent);stroke-width:5px;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8;vector-effect:non-scaling-stroke;animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.here{fill:var(--here);stroke:#ffffff;stroke-width:3}
.pulse{fill:var(--here);opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.6}to{transform:scale(2.6);opacity:0}}
.walker{fill:#ffffff;stroke:var(--accent);stroke-width:3}
.pin{fill:var(--accent);stroke:#ffffff;stroke-width:2}
.badge{stroke:#ffffff;stroke-width:2}
.badge.todo{fill:var(--gold)}.badge.ok{fill:var(--accent)}
.bt{font:800 12px var(--f-display);text-anchor:middle;pointer-events:none}
.bt.todo{fill:var(--gold-ink)}.bt.ok{fill:var(--accent-ink)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgb(0 0 0 / .35);z-index:15}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:82%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-block:14px max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.sheet>.in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{font:700 1.2rem var(--f-display);margin:0}
.sbody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion: no-preference){.sheet:not([hidden]){animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}

.qlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlog>li>button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem var(--f-body);cursor:pointer}
.qlog .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;background:var(--bg);font-variant-numeric:tabular-nums}
.qlog .ok .st{background:var(--gold);color:var(--gold-ink)}
.qlog .ok .nm{color:var(--muted);text-decoration:line-through}
.qlog .now>button{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.qlog .now .st{background:var(--accent);color:var(--accent-ink)}
.qlog .lock{opacity:.7}
.qlog .tagr{font-size:.8rem;color:var(--muted);font-weight:500}
.qlog .subs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 44px}
.qlog .sub{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.qlog .sub.ok{background:var(--gold-soft);text-decoration:line-through;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.82rem}
.modes{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--bg)}
.seg button{font:600 .95rem var(--f-body);padding:10px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .12)}
.objs.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;background:var(--bg);border:2px solid transparent;color:var(--ink);text-align:left;cursor:pointer;min-width:0;font-family:var(--f-body)}
.tile b{font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile span{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.tile.cur span{color:var(--accent);font-weight:700}
.tile.ok{opacity:.55}.tile.ok b{text-decoration:line-through}
.other{font-size:.95rem}
#welcome{position:absolute;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#welcome .big{font-size:4.5rem;line-height:1}
#welcome h2{font:700 2rem/1.2 var(--f-display);margin:0;color:var(--accent)}
#welcome p{margin:0;font-size:1.2rem;max-width:22ch}
#welcome .go{font:700 1.5rem var(--f-body);padding:20px 40px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--shadow)}
#welcome .en{font:600 1rem var(--f-body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
.heresel{display:flex;flex-direction:column;gap:6px}
.heresel select{font:600 1.05rem var(--f-body);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.other{align-self:flex-start;font:600 .85rem var(--f-body);background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.qlog .row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.qlog>li>button.tg{width:46px;padding:0;display:grid;place-items:center;grid-template-columns:none;color:var(--accent);font:700 1.1rem var(--f-body)}
.qlog .na{opacity:.55}
.voicebox{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.vrow select{min-width:0;font:500 .95rem var(--f-body);padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

.msgs{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:180px;flex:1}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;min-width:0;overflow-wrap:anywhere}
.msg.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.urgent{background:var(--warn-bg);color:var(--warn-ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .92rem var(--f-body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.mic{flex-shrink:0;width:48px;padding:0;font-size:1.2rem}
.mic.on,.fab.talk.on{background:var(--warn-ink);border-color:var(--warn-ink);color:#fff}
@media (prefers-reduced-motion: no-preference){.mic.on,.fab.talk.on{animation:listen 1s ease-in-out infinite}@keyframes listen{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--warn-ink) 25%,transparent)}}}
.listening{color:var(--warn-ink);font-weight:600;font-size:.9rem;align-self:flex-end}
.chip.go{background:var(--accent);color:var(--accent-ink)}
.typing{color:var(--muted);font-size:.9rem;align-self:flex-start}
form{display:flex;gap:8px}
form input{flex:1;min-width:0;font:400 1rem var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

.toast{position:absolute;left:50%;top:40%;z-index:30;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;background:var(--gold);color:var(--gold-ink);font:700 1.05rem var(--f-display);padding:12px 20px;border-radius:16px;box-shadow:var(--shadow);text-align:center;max-width:80%;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{display:block;font:600 .8rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
@media (prefers-reduced-motion: reduce){.r-line,.pulse{animation:none}.walker{display:none}.toast{transition:none}}

/* ---------- modern look ---------- */
.panel{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgb(255 255 255 / .8);border-radius:26px}
.quest{padding:16px 16px 18px;gap:10px}
.qtag{background:var(--gold-soft);color:#92400e;letter-spacing:0;text-transform:none;padding:6px 12px;font-weight:600;font-size:.95rem}
.qbar i{height:5px;background:#e2e8f0}.qbar i.ok{background:var(--accent-2)}.qbar i.now{background:var(--gold)}
.iconbtn{border:0;background:var(--bg);border-radius:14px;color:var(--ink)}
.qtitle h1{font-weight:600;letter-spacing:-.01em}
.qtitle .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#ccfbf1,#e0f2fe);font-size:1.45rem}
.qdesc{color:var(--muted)}
.tile{background:var(--bg);border-radius:18px;border:2px solid transparent;padding:12px 14px}
.tile.cur{background:#f0fdfa;border-color:var(--accent-2);box-shadow:0 6px 16px -8px rgb(13 148 136 / .5)}
.btn{border:0;border-radius:18px;background:var(--bg);font-family:var(--f-body)}
.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 10px 20px -8px rgb(13 148 136 / .7)}
.btn.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink);box-shadow:0 10px 20px -8px rgb(245 158 11 / .7)}
.btn:disabled{box-shadow:none}
.other{color:var(--accent);text-decoration-thickness:1.5px}
.fab{border:0;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.fab.talk{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff}
.route b{font-family:var(--f-display);font-weight:600}
.turns .ic{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;background:#ccfbf1;color:var(--accent);font-size:.9rem}
.turns li{align-items:center}
.room{stroke:var(--wall);stroke-width:1px}
.room.quest{fill:#fff7e0}
.room.hit{fill:#ccfbf1;stroke:var(--accent);stroke-width:2.4px}
.floorr{filter:drop-shadow(0 6px 14px rgb(15 23 42 / .08))}
.r-under{stroke:var(--accent-2);opacity:.25}
.r-line{stroke:var(--accent)}
.sheet{border-radius:28px 28px 0 0;background:var(--surface)}
.scrim{background:rgb(15 23 42 / .28);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.msg.bot{background:var(--bot);border:1px solid #ccfbf1}
.msg.me{background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.chip{border-width:1.5px;background:#fff}
.chip.go{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:#fff}
form input{border-radius:16px;background:var(--bg);border-color:transparent}
.qlog>li>button{border-radius:16px;border-color:var(--line)}
.qlog .ok .st{background:var(--accent-2);color:#fff}
.qlog .now .st{background:var(--gold);color:var(--gold-ink)}
.qlog .now>button{border-color:var(--gold);background:#fffbeb}
.seg{border-radius:16px}.seg button{border-radius:12px}
.toast{background:linear-gradient(135deg,var(--gold-2),var(--gold));border-radius:22px}
#welcome{background:radial-gradient(120% 80% at 50% 0%,#ccfbf1 0%,#f0f9ff 55%,#ffffff 100%)}
#welcome .big{width:110px;height:110px;border-radius:34px;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);font-size:3.6rem}
#welcome h2{font-weight:600;color:var(--ink)}
#welcome p{color:var(--muted)}
#welcome .go{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-radius:22px;box-shadow:0 14px 28px -10px rgb(13 148 136 / .8)}

/* ---------- นำทางแบบ Google Maps + มินิแมป ---------- */
.banner{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,#0f766e,#0d9488 60%,#14b8a6);color:#fff;box-shadow:0 12px 24px -12px rgb(13 148 136 / .9)}
.banner .arw{width:76px;height:76px;border-radius:24px;background:rgb(255 255 255 / .2);display:grid;place-items:center}
.banner .arw svg{width:54px;height:54px}
.banner .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.banner b{font:600 1.75rem/1.15 var(--f-display);letter-spacing:-.01em}
.banner .m{font:600 1.3rem/1.25 var(--f-body)}
.banner .nx{font-size:1rem;opacity:.92;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest.navig{padding:10px 10px 12px;gap:8px}
.quest.navig .qtitle,.quest.navig .qdesc,.quest.navig #qextra{display:none}
.quest.navig .qhead{padding:0 6px}
#cancelBtn{display:none}
.quest.navig #cancelBtn{display:inline-block}
.quest.navig #langBtn,.quest.navig .qbar{display:none}
.quest.navig .qtag{margin-right:auto}
.mini{pointer-events:auto;align-self:flex-start;flex-shrink:0;width:150px;padding:6px;border:0;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);cursor:pointer;line-height:0}
.mini.on{outline:3px solid var(--accent-2)}
.mini svg{width:100%;height:auto;display:block}
.mfloor{fill:#fff;stroke:#b6c3d1;stroke-width:1}
.mroom{fill:#dfe7ef}.mroom.hit{fill:#5eead4}
.mroute{fill:none;stroke:var(--here);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mdest{fill:var(--accent);stroke:#fff;stroke-width:1.2}
.mhere{fill:var(--here);stroke:#fff;stroke-width:1.4}
@media (prefers-reduced-motion: no-preference){.mhere{animation:blink 1.2s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}}
.fabrow{align-items:flex-end}
.r-past{fill:none;stroke:#c3cfdb;stroke-width:7px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-case{fill:none;stroke:#fff;stroke-width:15px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-main{fill:none;stroke:var(--here);stroke-width:9px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-dash{fill:none;stroke:#fff;stroke-width:2.5px;stroke-linecap:round;stroke-dasharray:1 16;vector-effect:non-scaling-stroke;opacity:.9;animation:march .9s linear infinite}
@keyframes march{to{stroke-dashoffset:-17}}
.corner{fill:#fff;stroke:var(--here);stroke-width:3}
.pulse{opacity:.35}
.pin{fill:#ef4444;stroke:#fff;stroke-width:2.5}
.skip{align-self:center;color:var(--muted);font-size:.95rem;padding:4px 8px}
@media (prefers-reduced-motion: reduce){.r-dash{animation:none}}

/* ================= สถานะ ================= */
let lang="th", mode="check", here="reg", dest="reg", viewFloor=1, camMode="route";
let age=null, docForced=false, youngOk=false, meds=null, pick=null;
const ck=Object.fromEntries(ITEMS.map(i=>[i.id,false]));
const $=id=>document.getElementById(id);
const T=(L,th,en)=>L==="th"?th:en;
const nm=(id,L)=>NODES[id][L]||"";
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const QUEST_MODE_ON=()=>mode==="check";

/* กฎขั้นตอน */
function need(id){const g=ITEM[id].grp;
  if(g==="doc"||g==="docprep")return age==="old"||docForced;
  if(g==="meds")return meds===true;
  return true}
const checksLeft=()=>ITEMS.filter(i=>i.grp==="check"&&!ck[i.id]);
function nearest(ids){let best=null,bd=Infinity;ids.forEach(id=>{const d=walkMeters(shortest(here,ITEM[id].node));if(d<bd){bd=d;best=id}});return best}
/* ขั้นตอนที่แนะนำตอนนี้ */
function phase(){
  if(!ck.reg)return"reg";
  if(age===null)return"age";
  if(checksLeft().length)return"check";
  if(age==="young"&&!docForced&&!youngOk)return"young";
  if(need("waitlab")&&!ck.waitlab)return"waitlab";
  if(need("doc")&&!ck.doc)return"doc";
  if(ck.doc&&meds===null)return"meds";
  if(need("rx")&&!ck.rx)return"rx";
  if(need("mpay")&&!ck.mpay)return"mpay";
  if(!ck.pay)return"pay";
  if(!ck.summary)return"summary";
  return"home";
}
/* รายการที่ควรทำตอนนี้ (ถ้าผู้ใช้เลือกเอง ใช้ที่เลือก) */
function curItem(){
  if(pick&&ITEM[pick]&&!ck[pick])return pick;
  const ph=phase();
  if(ph==="check")return nearest(checksLeft().map(i=>i.id));
  return ITEM[ph]?ph:null;
}
/* ช่วงตรวจตามห้อง: ให้ผู้ป่วยแตะเลือกห้องเอง (ตามที่เจ้าหน้าที่บอก) ไม่พาไปเองอัตโนมัติ */
function phaseNode(){const ph=phase();if(ph==="check"&&!(pick&&ITEM[pick]&&!ck[pick]))return here;const it=curItem();if(it)return ITEM[it].node;return ph==="home"?"ent":here}
/* รายการที่ทำได้ตรงจุดนี้ */
function itemAtHere(){
  if(pick&&ITEM[pick]&&!ck[pick]&&ITEM[pick].node===here)return pick;
  const c=curItem();if(c&&ITEM[c].node===here)return c;
  const o=ITEMS.find(i=>i.node===here&&!ck[i.id]&&need(i.id)&&(i.id!=="summary"||phase()==="summary")&&(i.id!=="waitlab"||phase()==="waitlab"));
  return o?o.id:null;
}
const doneCount=()=>ITEMS.filter(i=>need(i.id)&&ck[i.id]).length;
const totalCount=()=>ITEMS.filter(i=>need(i.id)||(i.grp==="doc"&&age===null)).length;

function readHash(){try{const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("qr-")&&NODES[h.slice(3)]&&NODES[h.slice(3)].qr){here=h.slice(3);return true}}catch(e){}return false}
const SAVE_KEY="nongnamtang-v2",KEEP_MS=12*3600e3;
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({mode,here,dest,ck,age,docForced,youngOk,meds,pick,lang,t:Date.now()}))}catch(e){}}
function restore(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(!s||Date.now()-s.t>KEEP_MS||!NODES[s.here]||!NODES[s.dest])return;
  mode=s.mode==="free"?"free":"check";here=s.here;dest=s.dest;age=s.age||null;docForced=!!s.docForced;youngOk=!!s.youngOk;meds=s.meds===true||s.meds===false?s.meds:null;
  pick=s.pick&&ITEM[s.pick]?s.pick:null;lang=s.lang==="en"?"en":"th";Object.keys(ck).forEach(k=>ck[k]=!!(s.ck&&s.ck[k]))}catch(e){}}
restore();
readHash();
/* ================= หาเส้นทางสั้นที่สุด ================= */
const ADJ={};
Object.keys(NODES).forEach(k=>ADJ[k]=[]);
EDGES.forEach(([a,b])=>{const A=NODES[a],B=NODES[b];const w=A.f!==B.f?15:Math.hypot(A.x-B.x,A.y-B.y);ADJ[a].push([b,w]);ADJ[b].push([a,w])});
function shortest(s,t){
  const dist={},prev={},done=new Set();Object.keys(NODES).forEach(k=>dist[k]=Infinity);dist[s]=0;
  while(true){let u=null;for(const k in dist)if(!done.has(k)&&(u===null||dist[k]<dist[u]))u=k;
    if(u===null||dist[u]===Infinity||u===t)break;done.add(u);
    for(const[v,w]of ADJ[u])if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}}
  const p=[t];while(p[0]!==s){if(!prev[p[0]])return[s];p.unshift(prev[p[0]])}return p;
}
function walkMeters(p){let m=0;for(let i=1;i<p.length;i++){const a=NODES[p[i-1]],b=NODES[p[i]];if(a.f===b.f)m+=Math.hypot(a.x-b.x,a.y-b.y)}return m}
function directions(p,L){
  const out=[];if(p.length<2)return out;
  const runs=[];let cur=[p[0]];
  for(let i=1;i<p.length;i++){if(NODES[p[i]].f!==NODES[p[i-1]].f){runs.push(cur);cur=[p[i]]}else cur.push(p[i])}
  runs.push(cur);
  runs.forEach((run,ri)=>{
    if(ri>0){const f=NODES[run[0]].f;let pf=NODES[runs[ri-1][runs[ri-1].length-1]].f;
      const last=out[out.length-1];if(last&&last.lift){out.pop();pf=last.f}
      out.push({lift:1,ic:f>pf?"⇧":"⇩",f:pf,text:T(L,`${f>pf?"ขึ้น":"ลง"}ลิฟต์ไปชั้น ${f}`,`Take the elevator ${f>pf?"up":"down"} to floor ${f}`)});
      if(run.length<2&&ri<runs.length-1)return}
    const segs=[];
    for(let i=1;i<run.length;i++){const a=NODES[run[i-1]],b=NODES[run[i]];const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);const d={x:dx/len,y:dy/len};
      const last=segs[segs.length-1];if(last&&last.d.x*d.x+last.d.y*d.y>.985)last.len+=len;else segs.push({d,len})}
    const f=NODES[run[0]].f;
    segs.forEach((s,si)=>{
      const m=Math.max(5,Math.round(s.len/5)*5);
      if(si===0){out.push({ic:"↑",f,text:ri>0?T(L,`ออกจากลิฟต์ เดินตรงไป ${m} ม.`,`Exit the elevator and walk ${m} m`):T(L,`เดินตรงไป ${m} ม.`,`Walk straight ${m} m`)})}
      else{const q=segs[si-1].d;const right=q.x*s.d.y-q.y*s.d.x>0;
        out.push({ic:right?"↱":"↰",f,text:T(L,`เลี้ยว${right?"ขวา":"ซ้าย"} เดิน ${m} ม.`,`Turn ${right?"right":"left"}, walk ${m} m`)})}
    });
  });
  const d=NODES[p[p.length-1]];
  out.push({ic:"⚑",f:d.f,text:T(L,`ถึง${d.th}${d.line?` (ตามเส้น${LINES[d.line].th})`:""}`,`Arrive at ${d.en}${d.line?` (${LINES[d.line].en} line)`:""}`)});
  return out;
}

/* ================= แผนที่นำทาง =================
   ตอนนำทาง: แผนที่หมุนตามทิศที่เดิน (ทางข้างหน้าอยู่ด้านบนจอเสมอ) เหมือน Google Maps
   มีป้ายบอกทางเลี้ยวด้านบน และมินิแมปทั้งชั้นที่มุมล่างซ้ายเหมือนในเกม */
const OUTPTS=[[36.5,42.5],[2,42.5],[2,2],[102,2],[102,42.5],[43.5,42.5]];
const svg=$("map");
let cam=null,camRaf=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const at=(x,y,inner)=>`<g transform="translate(${x} ${y})"><g class="sc">${inner}</g></g>`;
const dist=(a,b)=>Math.max(5,Math.round(walkMeters(shortest(a,b))/5)*5);
const r5=m=>Math.max(5,Math.round(m/5)*5);

/* ---- เส้นทางเป็นช่วงๆ (ช่วงตรง 1 ช่วง = 1 ขั้น) ---- */
function segsOf(p){const out=[];
  for(let i=1;i<p.length;i++){const a=NODES[p[i-1]],b=NODES[p[i]],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)continue;
    const d={x:dx/len,y:dy/len},l=out[out.length-1];
    if(l&&l.d.x*d.x+l.d.y*d.y>.985){l.len+=len;l.b=[b.x,b.y]}else out.push({a:[a.x,a.y],b:[b.x,b.y],d,len})}
  out.forEach((s,i)=>{if(i){const q=out[i-1].d;s.turn=q.x*s.d.y-q.y*s.d.x>0?"R":"L"}});return out}
let NAV={key:"",p:[],segs:[]},segIdx=0;
function navState(){const key=here+">"+dest;
  if(NAV.key!==key){const p=here===dest?[here]:shortest(here,dest);NAV={key,p,segs:segsOf(p)};segIdx=0;skipShort()}
  if(segIdx>=NAV.segs.length)segIdx=Math.max(0,NAV.segs.length-1);return NAV}
/* ช่วงสั้นมาก (ไม่ถึง 7 เมตร) ไม่ต้องให้กดแยก รวมไปกับทางเลี้ยวถัดไปเลย */
function skipShort(){while(segIdx<NAV.segs.length-1&&NAV.segs[segIdx].len<7)segIdx++}
const navigating=()=>here!==dest&&navState().segs.length>0;
const lastStep=()=>segIdx>=navState().segs.length-1;
const remaining=()=>navState().segs.slice(segIdx).reduce((a,s)=>a+s.len,0);

const ARW={
  up:'<path d="M24 40V10M12 22 24 10l12 12"/>',
  R:'<path d="M14 40V25q0-9 9-9h13M28 8l8 8-8 8"/>',
  L:'<path d="M34 40V25q0-9-9-9H12M20 8l-8 8 8 8"/>',
  flag:'<path d="M14 42V8M14 10h20l-5 7 5 7H14"/>'
};
const arw=k=>`<svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ARW[k]}</svg>`;

function renderMap(){
  const t=UI[lang],nav=navState(),p=nav.p,D=NODES[dest],H=NODES[here],going=navigating();
  const r=svg.getBoundingClientRect(),W=r.width||390,Hh=r.height||760;
  svg.setAttribute("viewBox",`0 0 ${W} ${Hh}`);
  const sg=going?nav.segs[segIdx]:null,pos=sg?sg.a:[H.x,H.y];
  /* ---- ป้ายบอกทาง + แถบด้านล่าง ---- */
  const bn=$("banner");bn.hidden=!going;$("quest").classList.toggle("navig",going);
  if(going){const nx=nav.segs[segIdx+1],m=r5(sg.len);
    const head=sg.turn?(sg.turn==="R"?t.turnR:t.turnL):t.straight;
    const sub=sg.turn?`${t.thenWalk} ${t.meters(m)}`:t.meters(m);
    const next=nx?`${t.nextIs} ${nx.turn==="R"?t.turnR:t.turnL}`:`${t.thenArrive} ${nm(dest,lang)}`;
    bn.innerHTML=`<span class="arw">${arw(sg.turn||"up")}</span><span class="tx"><b>${esc(head)}</b><span class="m">${esc(sub)}</span><span class="nx">${nx?"":"🚩 "}${esc(next)}</span></span>`;

    const ab=$("arrivedBtn");ab.hidden=false;ab.disabled=false;ab.className="btn primary";ab.textContent=lastStep()?t.arrived:t.nextStep;

  /* ---- แผนที่ ---- */

  ROOMS.forEach(rm=>{const hit=rm.node&&rm.node===dest&&here!==dest,qr=questRooms.includes(rm.node);

  WALLS.forEach(([a,b,c,d])=>{s+=`<line class="wall" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`});
  s+=`<polyline class="outline" points="${OUTPTS.map(q=>q.join(",")).join(" ")}"/>`;
  if(going){const all=p.map(k=>`${NODES[k].x},${NODES[k].y}`).join(" ");
    const rest=[sg.a].concat(nav.segs.slice(segIdx).map(x=>x.b)),pts=rest.map(q=>q.join(",")).join(" ");

    s+=at(rm.x+rm.w/2,rm.y+rm.h/2,`<text class="rl${hit?" hit":""}${rm.small?" sm":""}" text-anchor="middle">${ls.map((l,i)=>`<tspan x="0" dy="${i?1.2:(.35-(ls.length-1)*.6)}em">${esc(l)}</tspan>`).join("")}</text>`)});

/* ---- มินิแมป: ทั้งชั้น + จุดที่อยู่ + เส้นทาง ---- */

function routeParts(){if(here===dest)return null;const p=shortest(here,dest),ds=directions(p,lang),th=lang==="th",steps=[];
  const num=t=>{const m=t.match(/(\d+)/);return m?+m[1]:0};
  const dd=m=>th?(m<=5?"อีกนิดเดียว":`ประมาณ ${m} เมตร`):(m<=5?"just a few steps":`about ${m} meters`);
  ds.forEach(d=>{const m=num(d.text);
    if(d.ic==="↑")steps.push(th?`เดินตรงไป${dd(m)}`:`Walk straight ${dd(m)}`);
    else if(d.ic==="↱"||d.ic==="↰"){const side=d.ic==="↱"?(th?"ขวา":"right"):(th?"ซ้าย":"left");steps.push(th?`แล้วเลี้ยว${side} เดินต่อ${dd(m)}`:`then turn ${side} and go ${dd(m)}`)}
    else if(d.ic==="⇧"||d.ic==="⇩")steps.push(d.text);
  });
  return{steps,end:th?`ก็ถึง${nm(dest,lang)}แล้วค่ะ!`:`and there's ${nm(dest,lang)}!`,lead:th?`ไป${nm(dest,lang)}กันค่ะ`:`Off to ${nm(dest,lang)}!`}}
function spokenRoute(withLead=true){const r=routeParts();if(!r)return"";return`${withLead?r.lead+" § ":""}${r.steps.join(" § ")} § ${r.end}`}
/* พูดทีละขั้น เหมือนแอปนำทาง: บอกเฉพาะช่วงที่กำลังจะเดิน */
function stepSpeech(i,withLead){const r=routeParts();if(!r||!r.steps.length)return"";i=Math.min(i,r.steps.length-1);
  return`${withLead?r.lead+" § ":""}${r.steps[i]}${i===r.steps.length-1?" § "+r.end:""}`}
function sayPhase(lead){const ph=phase();navState();say(`${lead?lead+" § ":""}${PH_SAY[ph][lang]} § ${stepSpeech(segIdx,false)}`)}
function sayRoute(){navState();const r=stepSpeech(segIdx,true);if(r)say(r)}
function sayArrive(){const n=nm(here,lang);say(mode==="check"&&itemAtHere()?ARRIVE.target[lang](n):ARRIVE.plain[lang](n))}
function voiceUI(){const t=UI[lang];$("voiceBtn").textContent=voiceOn?"🔊":"🔇";$("voiceBtn").setAttribute("aria-label",voiceOn?t.voiceOff:t.voiceOn);
  $("sayBtn").textContent=t.replay;fillVoices()}
function fillVoices(){const sel=$("voiceSel");if(!sel)return;const vs=langVoices(lang),cur=voiceFor(lang);
  $("voiceBox").hidden=!canSpeak||!vs.length||!!clipSet;$("voiceLbl").textContent=UI[lang].voicePick;$("voiceTest").textContent=UI[lang].voiceTest;
  sel.innerHTML=vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a)).map(v=>`<option value="${esc(v.voiceURI)}"${cur&&v.voiceURI===cur.voiceURI?" selected":""}>${esc(v.name)}</option>`).join("")}
$("voiceBtn").onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem("nongnamtang-voice",voiceOn?"1":"0")}catch(e){}voiceUI();
  if(!voiceOn)stopSpeech();else if(mode==="check")sayPhase();else sayRoute()};

  chime();toast(UI[lang].done,iname(id));goNext(ARRIVE.item[lang](iname(id)));
}
$("arrivedBtn").onclick=()=>{
  if(here!==dest){navState();
    if(!lastStep()){segIdx++;skipShort();camMode="route";renderMap();say(stepSpeech(segIdx,false));return}
    here=dest;render();sayArrive();return}
  if(mode!=="check")return;
  const id=itemAtHere();if(id)completeItem(id);

  const a=e.target.closest("[data-age]");if(a){age=a.dataset.age;goNext();return true}

  const m=e.target.closest("[data-meds]");if(m){meds=m.dataset.meds==="1";goNext();return true}
  return false}

function answer(q){

  for(const it of INTENTS){const s=it.nkw.reduce((a,k)=>n.includes(k)?a+k.length:a,0);
    if(s>0&&it.urgent)return it.r(L);if(s>score){score=s;best=it}}
  if(best)return best.r(L);
  return{text:T(L,"ขอโทษค่ะ น้องนำทางยังไม่เข้าใจคำถามนี้ ลองเลือกหัวข้อด้านล่าง หรือสอบถามเจ้าหน้าที่ที่เคาน์เตอร์เวชระเบียนได้เลยค่ะ","Sorry, I didn't understand that. Try a topic below or ask staff at the Medical Records counter."),chips:quickChips(L)};
}
/* ================= แชต ================= */
const msgs=$("msgs");
function addMe(text){const d=document.createElement("div");d.className="msg me";d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
function addBot(res){
  const L=/[฀-๿]/.test(res.text)?"th":"en";
  const d=document.createElement("div");d.className="msg bot"+(res.urgent?" urgent":"");d.textContent=res.text;msgs.appendChild(d);
  const c=document.createElement("div");c.className="chips";
  if(res.dest){if(mode==="check"&&!res.route){const it=ITEMS.find(i=>i.node===res.dest&&!ck[i.id]&&need(i.id));pick=it?it.id:pick}else pick=null;setDest(res.dest)}else render();
  say((res.speak||res.text)+(res.dest&&here!==res.dest?" § "+(navState(),stepSpeech(segIdx,!!res.route)):""));
  if(res.dest&&res.dest!==here){const b=document.createElement("button");b.type="button";b.className="chip go";b.textContent=UI[L].showMap;b.onclick=closeSheets;c.appendChild(b)}
  (res.chips||[]).forEach(t=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)});
  if(c.children.length)msgs.appendChild(c);
  msgs.scrollTop=msgs.scrollHeight;
}
function send(text){
  text=text.trim();if(!text)return;addMe(text);
  const t=document.createElement("div");t.className="typing";t.textContent="…";msgs.appendChild(t);msgs.scrollTop=msgs.scrollHeight;
  setTimeout(()=>{t.remove();addBot(answer(text))},350);
}
$("form").addEventListener("submit",e=>{e.preventDefault();const q=$("q");send(q.value);q.value=""});

/* ================= พูดคุยด้วยเสียง (ใช้ระบบฟังเสียงในเบราว์เซอร์ ฟรี) ================= */
let inFrame=false;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
/* ในหน้าที่ฝังอยู่ในแอปอื่น (เช่นในแชต) ไมค์ใช้ไม่ได้ จึงซ่อนปุ่มไมค์ */
const SR=inFrame?null:(window.SpeechRecognition||window.webkitSpeechRecognition);
let micWatch=0,micCap=0,gotAudio=false;
let rec=null,listening=false,heard="",listenNote=null;
function micUI(){const t=UI[lang];
  $("micBtn").hidden=!SR;$("talkBtn").hidden=!SR;
  $("micBtn").textContent=listening?"■":"🎤";$("micBtn").setAttribute("aria-label",listening?t.micOn:t.mic);$("micBtn").classList.toggle("on",listening);
  $("talkBtn").textContent=listening?"■ "+t.micOn.split("…")[0]:t.talk2;$("talkBtn").classList.toggle("on",listening);
  if(listening&&!listenNote){listenNote=document.createElement("div");listenNote.className="listening";listenNote.textContent=t.micOn;msgs.appendChild(listenNote);msgs.scrollTop=msgs.scrollHeight}
  if(!listening&&listenNote){listenNote.remove();listenNote=null}}
function listen(){
  if(!SR)return;
  if(listening){try{rec.stop()}catch(e){}return}
  stopSpeech();heard="";
  try{rec=new SR()}catch(e){return}
  rec.lang=lang==="th"?"th-TH":"en-US";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;heard=t;$("q").value=t};
  rec.onaudiostart=()=>{gotAudio=true};rec.onspeechstart=()=>{gotAudio=true};
  rec.onerror=e=>{const t=UI[lang],m=e.error==="service-not-allowed"?t.micSiri:e.error==="not-allowed"?t.micDenied:e.error==="no-speech"?t.micNoSpeech:e.error==="aborted"?"":t.micFail;if(m)toast("🎤",m)};
  rec.onend=()=>{clearTimeout(micWatch);clearTimeout(micCap);listening=false;micUI();const t=heard.trim();heard="";if(t){$("q").value="";send(t)}};
  gotAudio=false;
  try{rec.start();listening=true}catch(e){listening=false;toast("🎤",UI[lang].micBlocked)}
  /* ถ้าไมค์ไม่ทำงานภายใน 5 วินาที ให้หยุดและบอกผู้ใช้ แทนการค้างอยู่ที่ "กำลังฟัง" */
  clearTimeout(micWatch);clearTimeout(micCap);
  micWatch=setTimeout(()=>{if(listening&&!gotAudio&&!heard){try{rec.abort()}catch(e){}listening=false;micUI();toast("🎤",UI[lang].micBlocked)}},5000);
  micCap=setTimeout(()=>{if(listening)try{rec.stop()}catch(e){}},15000);
  micUI();
}
$("micBtn").onclick=listen;
$("talkBtn").onclick=()=>{openSheet("chatSheet");listen()};
const _closeSheets=closeSheets;closeSheets=function(){if(listening)try{rec.abort()}catch(e){}_closeSheets()};
$("scrim").onclick=closeSheets;document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);

render();micUI();
{let seen=false;try{seen=sessionStorage.getItem("nongnamtang-welcomed")==="1"}catch(e){}
 if(!seen&&!ck.reg){welcomeUI();$("welcome").hidden=false}}
addBot({text:mode==="check"?"สวัสดีค่ะ! น้องนำทางพร้อมช่วยค่ะ ถามทางหรือขั้นตอนได้เลย เช่น “ไปไหนต่อ” (You can ask in English too)":"สวัสดีค่ะ! น้องนำทางพร้อมช่วยค่ะ ถามทางได้เลยนะคะ เช่น “ห้องน้ำอยู่ไหน” (You can ask in English too)",chips:quickChips("th")});
lastSpeech="";stopSpeech();
