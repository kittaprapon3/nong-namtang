name: สร้างเสียงพูด
on:
  push:
    branches: [main]
    paths: ["voice/phrases.json", "voice/gen.py", ".github/workflows/voice.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"
permissions:
  contents: write
concurrency: voice
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "edge-tts>=6.1.9"
      - run: python voice/gen.py
      - name: Commit voice files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice
          git diff --cached --quiet || (git commit -m "สร้างไฟล์เสียงพูด" && git push)
